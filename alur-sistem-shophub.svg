<svg width="640" height="900" viewBox="0 0 640 900" xmlns="http://www.w3.org/2000/svg" font-family="Sora, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="900" fill="#FBF7F0"/>
<text x="320" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#241A10">Alur sistem ShopHub</text>
<text x="320" y="68" text-anchor="middle" font-size="12.5" fill="#7C6C58">Dari membuka website sampai pesanan tercatat</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C1440E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="170" y="100" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="100" width="6" height="64" rx="3" fill="#C1440E"/>
<text x="320" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">1. Buka ShopHub</text>
<text x="320" y="146" text-anchor="middle" font-size="12" fill="#7C6C58">Halaman utama menampilkan katalog</text>
</g>
<line x1="320" y1="164" x2="320" y2="216" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="216" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="216" width="6" height="64" rx="3" fill="#C1440E"/>
<text x="320" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">2. Cari &amp; filter produk</text>
<text x="320" y="262" text-anchor="middle" font-size="12" fill="#7C6C58">Berdasarkan kata kunci dan kategori</text>
</g>
<line x1="320" y1="280" x2="320" y2="332" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="332" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="332" width="6" height="64" rx="3" fill="#C1440E"/>
<text x="320" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">3. Lihat detail produk</text>
<text x="320" y="378" text-anchor="middle" font-size="12" fill="#7C6C58">Cek deskripsi, harga, dan stok</text>
</g>
<line x1="320" y1="396" x2="320" y2="448" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="448" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="448" width="6" height="64" rx="3" fill="#C1440E"/>
<text x="320" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">4. Tambah ke keranjang</text>
<text x="320" y="494" text-anchor="middle" font-size="12" fill="#7C6C58">Sistem menghitung subtotal &amp; ongkir</text>
</g>
<line x1="320" y1="512" x2="320" y2="564" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="564" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="564" width="6" height="64" rx="3" fill="#D98B1F"/>
<text x="320" y="590" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">5. Checkout</text>
<text x="320" y="610" text-anchor="middle" font-size="12" fill="#7C6C58">Isi data penerima &amp; metode pembayaran</text>
</g>
<line x1="320" y1="628" x2="320" y2="680" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="680" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="680" width="6" height="64" rx="3" fill="#2F6D4F"/>
<text x="320" y="706" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">6. Sistem menyimpan pesanan</text>
<text x="320" y="726" text-anchor="middle" font-size="12" fill="#7C6C58">Data tersimpan ke localStorage</text>
</g>
<line x1="320" y1="744" x2="320" y2="796" stroke="#C1440E" stroke-width="1.6" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="796" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#E8DCC7" stroke-width="1"/>
<rect x="170" y="796" width="6" height="64" rx="3" fill="#2F6D4F"/>
<text x="320" y="822" text-anchor="middle" font-size="15" font-weight="700" fill="#241A10">7. Riwayat pesanan tampil</text>
<text x="320" y="842" text-anchor="middle" font-size="12" fill="#7C6C58">Status transaksi bisa dipantau</text>
</g>
</svg>
